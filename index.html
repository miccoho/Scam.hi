<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a question :)</title>
<style>
  :root{--pink1:#ffd9e8;--pink2:#ff9ec7;--pink3:#ff6fa5;--deep:#c23e75;--cream:#fff7fb;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:'Trebuchet MS','Comic Sans MS',system-ui,sans-serif;
    background:linear-gradient(180deg,var(--pink1) 0%,var(--pink2) 55%,var(--pink3) 100%);
    position:relative;}
  .heart{position:absolute;bottom:-10%;font-size:22px;opacity:.75;
    animation:float linear infinite;user-select:none;pointer-events:none;}
  @keyframes float{0%{transform:translateY(0) rotate(0)}10%{opacity:.8}
    100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}
  .cloud{position:absolute;background:#fff;border-radius:50%;opacity:.55;
    filter:blur(1px);pointer-events:none;}
  .stage{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px;}
  .frame{width:180px;height:180px;background:#fff;border:5px solid var(--cream);
    border-radius:22px;box-shadow:0 0 0 4px var(--pink3),0 10px 25px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;margin-bottom:22px;
    overflow:hidden;animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .frame img{max-width:92%;max-height:92%;object-fit:contain;}
  .shake{animation:shake .55s ease !important;}
  @keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}
    20%{transform:translate(-5px,2px) rotate(-5deg)}
    40%{transform:translate(5px,-2px) rotate(5deg)}
    60%{transform:translate(-4px,1px) rotate(-4deg)}
    80%{transform:translate(4px,-1px) rotate(4deg)}}
  h1{color:#fff;text-shadow:2px 2px 0 var(--deep),0 0 20px rgba(255,255,255,.4);
    font-size:clamp(28px,6vw,46px);letter-spacing:1px;margin:0 0 8px;line-height:1.15;}
  h2{color:#fff;text-shadow:2px 2px 0 var(--deep),0 0 20px rgba(255,255,255,.4);
    font-size:clamp(24px,5vw,36px);letter-spacing:1px;margin:0 0 18px;line-height:1.2;}
  .sub{color:#fff0f6;font-size:15px;margin-bottom:26px;min-height:20px;
    transition:opacity .2s ease;}
  .buttons{position:relative;width:100%;max-width:420px;height:80px;display:flex;
    align-items:center;justify-content:center;gap:22px;}
  button{font-family:inherit;font-weight:bold;font-size:18px;border:none;
    border-radius:999px;padding:16px 34px;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease;}
  #yesBtn{background:linear-gradient(180deg,#ff88b3,var(--deep));color:#fff;
    box-shadow:0 6px 0 #8e2350,0 10px 20px rgba(0,0,0,.25);}
  #yesBtn:hover{transform:translateY(-2px) scale(1.03);}
  #noBtn{background:#fff;color:var(--deep);
    box-shadow:0 6px 0 #d199b3,0 10px 20px rgba(0,0,0,.15);position:fixed;z-index:5;}
  .options{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
    max-width:430px;margin:0 auto;}
  .opt{background:#fff;color:var(--deep);font-family:inherit;font-weight:bold;
    font-size:16px;border-radius:999px;padding:14px 22px;
    box-shadow:0 5px 0 #d199b3,0 8px 16px rgba(0,0,0,.15);}
  .opt:hover{transform:translateY(-2px) scale(1.04);}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #d199b3;}
  #card{display:flex;flex-direction:column;align-items:center;}
  .hidden{display:none !important;}
  .pop{animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}
    100%{transform:scale(1);opacity:1}}
  #celebrateFrame,#dateFrame{width:210px;height:210px;}
  .flipping{animation:flipX .8s linear infinite;}
  @keyframes flipX{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
  .confetti{position:fixed;top:-5%;font-size:20px;pointer-events:none;
    animation:fall linear forwards;z-index:6;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
  #activity{color:#fff;font-size:clamp(20px,4.5vw,28px);font-weight:bold;
    text-shadow:1px 1px 0 var(--deep);margin-top:6px;}
  footer{position:fixed;bottom:14px;width:100%;text-align:center;color:#fff0f6;
    font-size:11px;opacity:.7;z-index:2;}
  @media (prefers-reduced-motion: reduce){.frame,.heart,.flipping{animation:none !important;}}
</style>

function dodge(){
  startSound();
  dodges++;
  var m=12;
  var x=Math.max(m,Math.random()*(window.innerWidth-noBtn.offsetWidth-m));
  var y=Math.max(m,Math.random()*(window.innerHeight-noBtn.offsetHeight-m));
  noBtn.style.left=x+'px'; noBtn.style.top=y+'px';
  document.getElementById('yesBtn').style.transform='scale('+Math.min(1.6,1+dodges*0.05)+')';
  stickerImg.src='data:image/jpeg;base64,'+sad[(dodges-1)%sad.length];
  stickerImg.classList.remove('shake');
  void stickerImg.offsetWidth;
  stickerImg.classList.add('shake');
  subtitle.style.opacity=0;
  setTimeout(function(){
    subtitle.textContent=teases[(dodges-1)%teases.length];
    subtitle.style.opacity=1;
  },150);
}
noBtn.addEventListener('mouseenter',dodge);
noBtn.addEventListener('touchstart',function(e){e.preventDefault();dodge();},{passive:false});

function sayYes(){
  startSound();
  document.getElementById('card').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('celebrateImg').classList.add('flipping');
  confettiBurst(); fanfare();
}

function pick(label){
  document.getElementById('result').classList.add('hidden');
  var ds=document.getElementById('dateSet');
  ds.classList.remove('hidden');
  document.getElementById('activity').textContent=label;
  confettiBurst(); fanfare();
}

function confettiBurst(){
  var e=['💖','✨','🎉','🌸','💗','🩷'];
  for(var i=0;i<70;i++){
    (function(i){setTimeout(function(){
      var el=document.createElement('div');
      el.className='confetti';
      el.textContent=e[Math.floor(Math.random()*e.length)];
      el.style.left=Math.random()*100+'vw';
      el.style.animationDuration=(2.5+Math.random()*2)+'s';
      el.style.fontSize=(14+Math.random()*16)+'px';
      document.body.appendChild(el);
      setTimeout(function(){el.remove();},5000);
    },i*35);})(i);
  }
}

var ctx=null,playing=false,loopTimer=null,master=null;
function note(freq,start,dur,type,vol){
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(vol,start+0.015);
  g.gain.exponentialRampToValueAtTime(0.001,start+dur);
  o.connect(g); g.connect(master);
  o.start(start); o.stop(start+dur+0.05);
}
var N={C:261.63,E:329.63,F:349.23,G:392.00,A:440.00,B:493.88,
       C2:523.25,D2:587.33,E2:659.25,G2:783.99,A2:880.00};
var melody=[[N.G,.18],[N.A,.18],[N.B,.18],[N.C2,.36],[N.B,.18],[N.A,.18],[N.G,.36],
 [N.E,.18],[N.G,.18],[N.C2,.36],[N.B,.18],[N.G,.18],[N.A,.54],
 [N.C2,.18],[N.D2,.18],[N.E2,.36],[N.D2,.18],[N.C2,.18],[N.B,.36],
 [N.A,.18],[N.B,.18],[N.C2,.18],[N.A,.18],[N.G,.72]];
var bass=[N.C/2,N.G/2,N.A/2,N.F/2,N.C/2,N.G/2,N.F/2,N.G/2];
function scheduleLoop(){
  var t0=ctx.currentTime+0.06,t=t0;
  melody.forEach(function(p){ note(p[0],t,p[1]*0.9,'square',0.13); t+=p[1]; });
  var total=t-t0, step=total/bass.length, bt=t0;
  bass.forEach(function(f){ note(f,bt,step*0.8,'triangle',0.20); bt+=step; });
  for(var i=0;i<8;i++){ note(N.E2,t0+i*step+step*0.5,0.05,'sawtooth',0.045); }
  loopTimer=setTimeout(function(){ if(playing) scheduleLoop(); }, total*1000);
}
function startSound(){
  if(playing) return;
  try{
    if(!ctx){
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination);
    }
    if(ctx.state==='suspended') ctx.resume();
    playing=true; scheduleLoop();
  }catch(err){}
}
function fanfare(){
  if(!ctx) return;
  var t=ctx.currentTime+0.05;
  [N.C2,N.E2,N.G2,N.A2].forEach(function(f,i){ note(f,t+i*0.09,0.4,'square',0.2); });
}
document.body.addEventListener('click',startSound,{once:true});
document.body.addEventListener('touchstart',startSound,{once:true});

function heart(){
  var h=document.createElement('div');
  h.className='heart';
  h.textContent=['💗','💖','🩷','✨'][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*100+'vw';
  h.style.animationDuration=(6+Math.random()*6)+'s';
  h.style.fontSize=(14+Math.random()*16)+'px';
  document.body.appendChild(h);
  setTimeout(function(){h.remove();},13000);
}
setInterval(heart,700);
for(var i=0;i<6;i++){
  var c=document.createElement('div'); c.className='cloud';
  var s=60+Math.random()*100;
  c.style.width=s+'px'; c.style.height=s*0.5+'px';
  c.style.left=Math.random()*100+'vw'; c.style.top=Math.random()*60+'vh';
  document.body.appendChild(c);
}
